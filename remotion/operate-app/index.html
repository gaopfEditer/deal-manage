<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Operate Tools</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0d1117;
      }

      /* 自定义滚动条 */
      * {
        scrollbar-width: thin;
        scrollbar-color: #484f58 #161b22;
      }
      *::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      *::-webkit-scrollbar-track {
        background: #161b22;
        border-radius: 8px;
      }
      *::-webkit-scrollbar-thumb {
        background: #484f58;
        border-radius: 8px;
        border: 2px solid #161b22;
      }
      *::-webkit-scrollbar-thumb:hover {
        background: #6e7681;
      }
      *::-webkit-scrollbar-corner {
        background: #161b22;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
